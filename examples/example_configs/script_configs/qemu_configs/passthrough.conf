# qemu_test configuration with the NVIDIA GPU passed through (run vfio_bind first)
# PCI addresses from lspci; must match DEVICES in vfio_bind
GPU_ADDR="01:00.0"
GPU_AUDIO_ADDR="01:00.1"
ARCH="x86_64"
KERNEL_PATH="$TESTING_REPO/kernel/compiled/arch/x86_64/boot/bzImage"
BOOT_FILE="image.raw"
DISK_FORMAT="raw"
ROOTFS="ext4"
MEMORY="1G"
CPUS="1"
NUMA_ID="0"
SERIAL="mon:stdio"
MONITOR="vc"
DISPLAY="none"
EXTRA="mkosi.extra"
BOOT_PARAMS="nokaslr printk.synchronous=1 earlyprintk=serial,0x3f8,115200"
QEMU="qemu-system-x86_64"
ACCEL="kvm"
INTERFACE="ide"
IP_PORT="10022-:22"
RPATH="/dev/sda1"
CONSOLE="ttyS0"
USER="-device vfio-pci,host=$GPU_ADDR,multifunction=on -device vfio-pci,host=$GPU_AUDIO_ADDR"
