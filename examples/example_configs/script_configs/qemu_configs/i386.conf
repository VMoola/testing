# Default configuration for qemu_test
ARCH="i386"
KERNEL_PATH="$HOME/kernel/i386/arch/x86/boot/bzImage"
BOOT_FILE="$HOME/images/buildroot/i386/rootfs.ext2"
ROOTFS="ext4"
MEMORY="1G"
CPUS="1"
NUMA_ID="0"
SERIAL="stdio"
MONITOR="vc"
DISPLAY="gtk"
EXTRA="$HOME/testing/mkosi.extra"
BOOT_PARAMS="nokaslr printk.synchronous=1 earlyprintk=serial,0x3f8,115200"
QEMU="qemu-system-i386"
ACCEL="kvm -accel tcg"
INTERFACE="virtio"
IP_PORT="10022-:22"
RPATH="/dev/vda"
CONSOLE="ttyS0"
USER=""
